# Customer configuration: the fictional hotel group of stages 0-8 (SYNTHETIC).
# The canonical data model is customer-neutral. This file says how this customer's upstream systems name and shape
# things, so a real customer's export can be mapped onto the canonical model (docs/real-system-swap-guide.md).
# Cedarpoint Inns gets its own file in Milestone 14 (ADR-0012, ADR-0033).

customer_id: hg-demo
display_name: Simulated hotel group (stages 0-8)
policy_set: policies/hg-demo
synthetic: true

# Assumptions, not measurements (ADR-0055). A real customer's business owner sets these in a pilot.
approval_ttl_hours: 24
max_evidence_age_minutes: 60

properties:
  beach-resort:
    name: Beach Resort
    booking_prefix: BR
    timezone: America/New_York
  mountain-lodge:
    name: Mountain Lodge
    booking_prefix: ML
    timezone: America/New_York

member_number:
  prefix: GR-
  digits: 5

channels: [direct, phone, ota, travel_agent]

# Reservation source code -> channel, used to derive a blank channel (defect D03).
source_code_channels:
  WEB: direct
  APP: direct
  FD: direct
  CALL: phone
  OTA-FEED: ota
  GDS-TA: travel_agent
  LEGACY-IMPORT: null   # cannot be derived

partner_confirmation_prefix: TRV-

# Canonical field -> this customer's upstream field name (what the mock customer API serves, ADR-0035).
# The app's adapter maps upstream -> canonical; the mock API maps canonical -> upstream. Real exports map the same way.
field_mapping:
  member:
    member_number: loyaltyId
    first_name: givenName
    last_name: familyName
    email: emailAddress
    phone: phoneNumber
    date_of_birth: birthDate
    tier: tierCode
    home_region: homeRegion
    enrolled_on: enrollmentDate
    status: accountStatus
    merged_into: mergedIntoLoyaltyId
  stay:
    record_id: pmsRecordId
    stay_id: confirmationNumber
    property: propertyCode
    member_number: loyaltyId
    member_on_booking: loyaltyIdAtBooking
    arrival_date: arrivalDate
    nights: nights
    checkout_at_utc: checkoutTimestampUtc
    status: stayStatus
    channel: bookingChannel
    source_code: reservationSource
    rate_code: rateCode
    partner_confirmation: partnerConfirmation
    room_revenue_cents: roomRevenue
    taxes_cents: taxAmount
    fees_cents: feeAmount
    guest_name: guestName
  ledger_entry:
    entry_id: transactionId
    member_number: loyaltyId
    stay_id: confirmationNumber
    kind: transactionType
    points: points
    posted_at_utc: postedTimestampUtc
    reverses_entry_id: reversesTransactionId
  posting_queue_item:
    item_id: queueItemId
    member_number: loyaltyId
    stay_id: confirmationNumber
    points: points
    queued_at_utc: queuedTimestampUtc
    expected_post_at_utc: expectedPostTimestampUtc
    posts_entry_id: postsTransactionId
  adjustment:
    adjustment_id: adjustmentId
    idempotency_key: idempotencyKey
    member_number: loyaltyId
    stay_id: confirmationNumber
    points: points
    reason_code: reasonCode
    note: note
    requested_by: requestedBy
    created_at_utc: createdTimestampUtc
    ledger_entry_id: transactionId
    status: adjustmentStatus
  ticket:
    ticket_id: ticketId
    member_number: loyaltyId
    subject: subject
    body: body
    created_at_utc: createdTimestampUtc

# Upstream enum codes -> canonical values.
value_maps:
  accountStatus: {ACTIVE: active, MERGED: merged}
  stayStatus: {BOOKED: booked, IN_HOUSE: in_house, CHECKED_OUT: checked_out}
  bookingChannel: {DIRECT: direct, PHONE: phone, OTA: ota, TRAVEL_AGENT: travel_agent}
  transactionType: {POST: posting, REV: reversal, REPOST: repost, ADJ: adjustment}
  adjustmentStatus: {APPLIED: applied}

# Upstream money is a decimal string in US dollars ("1299.90"); canonical money is integer cents.
conversions:
  roomRevenue: usd_to_cents
  taxAmount: usd_to_cents
  feeAmount: usd_to_cents
# Which identity-provider group gives which role (spec C.4; ENT-25). No mapped group means no access.
oidc:
  group_roles:
    loyalty-agents: agent
    loyalty-supervisors: supervisor
    loyalty-admins: administrator
    loyalty-auditors: auditor
