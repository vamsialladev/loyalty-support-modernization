# Grafana dashboard provider for the observability profile (ADR-0080). The dashboards are files in this repository;
# edits in the Grafana UI aren't saved, so a change is a reviewed commit.
apiVersion: 1
providers:
  - name: loyalty
    folder: Loyalty support
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/loyalty
