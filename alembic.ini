[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The app's schema (Alembic owns it, ADR-0002). The URL comes from DATABASE_URL (migrations/env.py).

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
