# CI (ADR-0053; Milestone 12, ADR-0076). Offline only: no API key, no paid service. Every value here is a throwaway
# for this workflow's own database. The same steps run locally, without Actions minutes:
#   powershell -ExecutionPolicy Bypass -File scripts\ci_local.ps1
# Triggers: the repository is public since 2026-11-13 (standard runners cost no minutes), so the once-per-change
# limit from ADR-0076 is lifted: every pull request, and pushes to main and ci/**.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests with the coverage gate (the browser tests run in their own job)
        run: uv run pytest -m "not browser" --cov --cov-report=term-missing -rs
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-groups -o requirements-audit.txt -q
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip

  release-gate:
    # BENCH-13 (ADR-0082): a change that can alter arm C re-runs the frozen mock regression against the committed
    # known-good run. Mock provider only: no key, no cost. A pull request that touches nothing AI-relevant passes in
    # seconds ("not needed").
    name: Release gate (prompt, model and AI changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the gate diffs against the base branch
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Synthetic seed data (Git-ignored, regenerated)
        run: uv run python -m seed_data.generator generate
      - name: Re-run arm C on the mock and compare with benchmarks/results/mock/c-mock-dev
        run: uv run python scripts/release_gate.py --base "origin/${{ github.base_ref }}"

  postgres:
    name: Real-Postgres tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: mock_api
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: mock_customer_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mock_api -d mock_customer_api_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_MOCK_API_DATABASE_URL: postgresql+psycopg://mock_api:ci-only-throwaway@127.0.0.1:5432/mock_customer_api_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://loyalty_app:ci-only-throwaway@127.0.0.1:5432/loyalty_test
      TEST_APP_OWNER_DATABASE_URL: postgresql+psycopg://loyalty_owner:ci-only-throwaway@127.0.0.1:5432/loyalty_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Databases and roles, incl. a Milestone 5 database whose role split must keep its login (ADR-0058)
        run: sh scripts/ci_postgres_setup.sh
      - name: Migrations on an empty database, down to base and up again (DEL-02)
        env:
          PGPASSWORD: ci-only-throwaway
          DATABASE_URL: postgresql+psycopg://loyalty_owner:ci-only-throwaway@127.0.0.1:5432/loyalty_migrate
        run: |
          psql -h 127.0.0.1 -U mock_api -d mock_customer_api_test -c "CREATE DATABASE loyalty_migrate OWNER loyalty_owner"
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -m postgres -rs

  browser:
    # Playwright's own image, with Chromium and its system libraries already in it: no apt step, so a slow apt
    # mirror can't eat the time limit (the Milestone 11 runner failure, verification log M11 row 22; ADR-0084).
    name: Browser tests (Playwright image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m browser -rs

  images:
    # DEL-02, DEL-04, SEC-11 (ADR-0084): build every image, scan it, and record what's in it.
    name: Images, scans, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write      # provenance attestations, on pushes to main only
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the app, protocols and mock API images
        run: |
          docker build --target app -t loyalty-app:ci -f Dockerfile.app .
          docker build --target protocols -t loyalty-protocols:ci -f Dockerfile.app .
          docker build -t loyalty-mock-api:ci -f mock_customer_api/Dockerfile .
          docker build -t loyalty-demo:ci -f Dockerfile.demo .   # the public demo's one image (ADR-0087)
      - name: Trivy, images (fixable HIGH and CRITICAL fail the build)
        run: |
          for image in loyalty-app:ci loyalty-protocols:ci loyalty-mock-api:ci loyalty-demo:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 image \
              --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Trivy, Dockerfiles and infrastructure as code
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.1 config --quiet --severity HIGH,CRITICAL \
            --exit-code 1 --skip-dirs /repo/.venv --skip-dirs /repo/seed_data --skip-dirs /repo/benchmarks /repo
      - name: SBOM of the app image (SPDX JSON)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: loyalty-app:ci
          format: spdx-json
          artifact-name: sbom-loyalty-app.spdx.json
      - name: Save the app image for provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save loyalty-app:ci -o loyalty-app.tar
      - name: Provenance attestation (public repository; pushes to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: loyalty-app.tar

  terraform:
    # DEL-06 (ADR-0085): the AWS reference path is checked, never planned or applied; no AWS credentials exist here.
    name: Terraform (fmt, validate; never applied)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: fmt, init without a backend, validate
        run: |
          tf="docker run --rm -v $PWD/infrastructure/terraform/aws:/tf -w /tf hashicorp/terraform:1.17.1"
          $tf fmt -check -recursive -diff
          $tf init -backend=false -input=false -no-color
          $tf validate -no-color
      - name: Trivy, the Terraform (fixable HIGH and CRITICAL fail)
        run: |
          docker run --rm -v "$PWD/infrastructure/terraform/aws:/tf:ro" aquasec/trivy:0.76.1 config --quiet \
            --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /tf/.terraform /tf

  compose:
    # The default stack from an empty volume, as a newcomer would start it (DEL-02, ADR-0084).
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Synthetic seed data and a throwaway env file
        shell: pwsh
        run: |
          uv run python -m seed_data.generator generate
          ./scripts/update-local-env.ps1 -Path .env.ci
      - name: Start the stack and wait for every health check
        run: docker compose -p ci --env-file .env.ci up --build -d --wait
      - name: Seed the demo, then the app is ready
        run: |
          docker compose -p ci --env-file .env.ci exec -T app python -m app.seed --dataset demo
          curl --fail --silent --show-error http://127.0.0.1:8010/readyz
      - name: Logs if it failed (scrubbed JSON)
        if: failure()
        run: docker compose -p ci --env-file .env.ci logs --tail 100
      - if: always()
        run: docker compose -p ci --env-file .env.ci down -v

  secrets:
    name: Secret scan of the full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
