# Weekly update pull requests (SEC-11, ADR-0084). Each one runs the full CI, including the image scans and, when it
# touches AI-relevant code, the release gate. Nothing merges without a person.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /mock_customer_api
    schedule: {interval: weekly}
