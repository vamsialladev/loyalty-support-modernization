# LIVE: spends real money. Milestone 13, Phase 3: arm C with provider prompt caching (L3, ADR-0091). Identical to
# arm-c-live.yaml except prompt_cache and cache_state, so the two arms differ in one factor only. Runs only after
# the owner approves the cost estimate (CLAUDE.md, Milestone 13).
arm: C
provider: live
model: claude-haiku-5-5
prompt_version: "1"
tool_permissions: five read-only tools, run as the person who asked (config/ai/hg-demo.yaml, app/ai/tools.py)
limits: config/ai/hg-demo.yaml as committed
timeout_retry: config/ai/hg-demo.yaml as committed
repetitions: 3
cost_ceiling_usd: 2.50
dataset_version: v1
retrieval: postgres-fts or its SQLite equivalent, as the arm uses it; the same for arms B and C
concurrency: 1
environment: disposable SQLite per run, worker driven in one process, mock customer API (benchmark environment, not production)
cache_state: provider prompt caching on (automatic breakpoint, 5-minute lifetime); every run starts from an empty database
prompt_cache: true
