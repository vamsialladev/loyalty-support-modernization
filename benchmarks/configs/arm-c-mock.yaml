# Pipeline check only. MOCK: never evidence of a real model's quality, and it never decides a hypothesis.
arm: C
provider: mock
model: null
prompt_version: "1"
tool_permissions: five read-only tools, run as the person who asked (config/ai/hg-demo.yaml, app/ai/tools.py)
limits: config/ai/hg-demo.yaml as committed
timeout_retry: config/ai/hg-demo.yaml as committed
repetitions: 3
cost_ceiling_usd: null
dataset_version: v1
retrieval: postgres-fts or its SQLite equivalent, as the arm uses it; the same for arms B and C
concurrency: 1
environment: disposable SQLite per run, worker driven in one process, mock customer API (benchmark environment, not production)
cache_state: no prompt caching; every run starts from an empty database
