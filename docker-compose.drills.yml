# Drill-only overrides (Milestone 13b; docs/drills.md). Never used by the normal stack, the demo or CI's other jobs.
# `scripts/drill.py` recreates only the services a drill needs with this file added, for example:
#   docker compose -p ci --env-file .env.ci -f docker-compose.yml -f docker-compose.drills.yml up -d --no-deps mock-api
services:
  mock-api:  # D5: seeded faults from a rules file the drill writes into its own output
    environment:
      MOCK_API_FAULTS: "true"
      MOCK_API_FAULT_RULES_FILE: /drill-rules/rules.yaml
    volumes:
      - ./drill-output/rules:/drill-rules:ro
  app:  # D1, D6: the mock model fails on purpose (empty = the plain mock; ignored in the public demo)
    environment:
      MOCK_MODEL_FAULT: ${MOCK_MODEL_FAULT:-}
  worker:
    environment:
      MOCK_MODEL_FAULT: ${MOCK_MODEL_FAULT:-}
