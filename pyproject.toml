[project]
name = "loyalty-support-modernization"
version = "0.1.0"
description = "Stage 9 of a simulated hotel-group engagement: missing-points investigations with human-approved simulated adjustments, benchmarked legacy vs conventional vs AI. Synthetic data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vamsi Alla", email = "vamsialla.dev@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic~=1.0",
    "httpx~=0.28.1",
    "pydantic~=2.14.1",
    "pyjwt[crypto]~=2.10",
    "pypdf~=6.0",
    "python-dotenv~=1.2.4",
    "pyyaml~=6.0.3",
    "tzdata>=2026.6",
]

[dependency-groups]
api = [
    "alembic~=1.20.1",
    "argon2-cffi~=25.1.0",
    "fastapi~=0.162.0",
    "jinja2~=3.1.6",
    "psycopg[binary]~=3.3.6",
    "python-multipart~=0.0.32",
    "sqlalchemy~=2.1.6",
    "uvicorn[standard]~=0.54.0",
]
protocols = [
    # Spec Part G, RFC-0004: MCP 2026-07-28, A2A 1.0, AG-UI 1.0. Not in the core image (Dockerfile.app).
    "a2a-sdk[http-server]~=1.3.0",
    "ag-ui-protocol~=1.0.0",
    "mcp~=2.3.0",
]
data = [
    "matplotlib~=3.11.2",
    "pillow~=13.0.0",
    "reportlab~=5.1.0",
]
dev = [
    "axe-playwright-python~=0.1.8",
    "mypy~=2.4.1",
    "playwright~=1.64.1",
    "pre-commit~=4.7.0",
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "pytest-playwright~=0.10.0",
    "ruff~=0.17.3",
    "scikit-learn~=1.7",
    "types-pyyaml~=6.0.12",
]

[tool.uv]
package = false
default-groups = ["dev", "api", "data", "protocols"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "S608"]  # fake secrets, seeded randomness, git calls, fixed SQL
"seed_data/**" = ["S311"]  # reproducible synthetic data needs a seeded, non-cryptographic generator
"app/env_leaks.py" = ["S603", "S607"]  # runs `git ls-files`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "postgres: needs a real PostgreSQL through the TEST_*_DATABASE_URL settings (skipped, with the reason, if absent)",
    "browser: drives Chromium with Playwright (skipped, with the reason, if Chromium is not installed)",
    "interop: runs an independent protocol client or peer (opt in with RUN_INTEROP=1; needs Node)",
]

[tool.coverage.run]
source = ["app", "protocols", "benchmarks", "seed_data", "evaluations", "mock_customer_api", "customer_shapes"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "protocols", "benchmarks", "scripts", "seed_data", "evaluations", "mock_customer_api", "customer_shapes"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "sklearn.*", "google.protobuf.*"]
ignore_missing_imports = true  # reportlab ships no type information
