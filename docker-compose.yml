# Local stack (spec F.2): Postgres 16, the mock customer API, the app. Ports bind to 127.0.0.1 only; the host ports
# default to 5432 / 8020 / 8010 and can be moved with DB_HOST_PORT, MOCK_API_HOST_PORT, APP_HOST_PORT (the compose
# check uses other ports so it can run next to your own stack).
#   docker compose up --build -d
#   docker compose exec app python -m app.seed --dataset demo
# Values come from .env (see .env.example); `python -m app.preflight` checks them without printing them.
# Generate seed_data/v1 first (`scripts\data.ps1 -Action generate`); it is mounted read-only, never baked in.
name: loyalty

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-loyalty}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_OWNER_DB_PASSWORD: ${APP_OWNER_DB_PASSWORD:?set APP_OWNER_DB_PASSWORD in .env}
      MOCK_API_DB_PASSWORD: ${MOCK_API_DB_PASSWORD:?set MOCK_API_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/postgres/sql:/pg-sql:ro
      - ./infrastructure/postgres/upgrade:/pg-upgrade:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  mock-api:
    build:
      context: .
      dockerfile: mock_customer_api/Dockerfile
    environment:
      MOCK_API_DATABASE_URL: postgresql+psycopg://mock_api:${MOCK_API_DB_PASSWORD:?set MOCK_API_DB_PASSWORD in .env}@db:5432/mock_customer_api
      MOCK_API_TOKEN: ${MOCK_API_TOKEN:?set MOCK_API_TOKEN in .env}
      MOCK_API_FAULTS: ${MOCK_API_FAULTS:-false}
      MOCK_API_SIM_CLOCK: ${MOCK_API_SIM_CLOCK:-false}
      MOCK_API_SEED_DIR: /seed_data/v1
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
    volumes:
      - ./seed_data/v1:/seed_data/v1:ro
    ports:
      - "127.0.0.1:${MOCK_API_HOST_PORT:-8020}:8020"
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/healthz', timeout=5)"]
      interval: 5s
      timeout: 10s  # includes starting Python, which takes seconds on a busy machine (ADR-0052)
      retries: 30
      start_period: 120s  # migrations run before the server starts; a slow cold start isn't a failure
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  # One-shot: the only service with the owner role's password (ADR-0058). The app and worker can't change the schema.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://loyalty_owner:${APP_OWNER_DB_PASSWORD:?set APP_OWNER_DB_PASSWORD in .env}@db:5432/loyalty
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      DATABASE_URL: postgresql+psycopg://loyalty_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/loyalty
      MOCK_API_URL: http://mock-api:8020
      MOCK_API_TOKEN: ${MOCK_API_TOKEN:?set MOCK_API_TOKEN in .env}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      APP_PROFILE: ${APP_PROFILE:-portfolio}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
      MOCK_API_SIM_CLOCK: ${MOCK_API_SIM_CLOCK:-false}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8010}:8010"
    depends_on:
      migrate: {condition: service_completed_successfully}
      mock-api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/healthz', timeout=5)"]
      interval: 5s
      timeout: 10s  # includes starting Python, which takes seconds on a busy machine (ADR-0052)
      retries: 30
      start_period: 120s  # migrations run before the server starts; a slow cold start isn't a failure
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

volumes:
  pgdata:
